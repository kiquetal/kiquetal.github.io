<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDP vs TCP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f5; }
        .infographic { width: 500px; height: 600px; background: white; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .kiquetal-ribbon { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); color: #f5f5f5; text-align: center; padding: 8px; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.15em; border-top: 1px solid #444; opacity: 0.85; }
        .kiquetal-ribbon::before { content: '✦'; margin-right: 8px; color: #888; }
        .kiquetal-ribbon::after { content: '✦'; margin-left: 8px; color: #888; }
    </style>
</head>
<body>
    <div class="infographic relative">
        <div class="p-8 h-full flex flex-col">
            <h1 class="text-3xl font-bold text-center mb-8">UDP vs TCP</h1>
            
            <div class="grid grid-cols-2 gap-4 flex-1">
                <div class="bg-blue-50 p-4 rounded-lg">
                    <h2 class="text-xl font-bold text-blue-900 mb-4 text-center">UDP</h2>
                    <div class="space-y-4 text-sm">
                        <div class="flex items-start gap-2">
                            <span class="text-2xl">⚡</span>
                            <div>
                                <p class="font-semibold">Fast</p>
                                <p class="text-gray-600">No overhead</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-2">
                            <span class="text-2xl">🔓</span>
                            <div>
                                <p class="font-semibold">Connectionless</p>
                                <p class="text-gray-600">No handshake</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-2">
                            <span class="text-2xl">❌</span>
                            <div>
                                <p class="font-semibold">No Guarantee</p>
                                <p class="text-gray-600">May lose packets</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-2">
                            <span class="text-2xl">📺</span>
                            <div>
                                <p class="font-semibold">Streaming</p>
                                <p class="text-gray-600">Video, gaming</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="bg-green-50 p-4 rounded-lg">
                    <h2 class="text-xl font-bold text-green-900 mb-4 text-center">TCP</h2>
                    <div class="space-y-4 text-sm">
                        <div class="flex items-start gap-2">
                            <span class="text-2xl">✅</span>
                            <div>
                                <p class="font-semibold">Reliable</p>
                                <p class="text-gray-600">Error checking</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-2">
                            <span class="text-2xl">🔗</span>
                            <div>
                                <p class="font-semibold">Connection-based</p>
                                <p class="text-gray-600">3-way handshake</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-2">
                            <span class="text-2xl">📦</span>
                            <div>
                                <p class="font-semibold">Guaranteed</p>
                                <p class="text-gray-600">All packets arrive</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-2">
                            <span class="text-2xl">🌐</span>
                            <div>
                                <p class="font-semibold">Web Browsing</p>
                                <p class="text-gray-600">HTTP, email</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="kiquetal-ribbon">co-designed by kiquetal</div>
    </div>
</body>
</html>
