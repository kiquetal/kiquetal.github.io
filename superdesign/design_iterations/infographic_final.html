<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infographic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 800px;
            height: 900px;
            background: linear-gradient(135deg, #f5e6d3 0%, #e8d5c4 50%, #d4c4a8 100%);
            overflow: hidden;
        }
        .vintage-texture {
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139, 115, 85, 0.03) 2px, rgba(139, 115, 85, 0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(139, 115, 85, 0.03) 2px, rgba(139, 115, 85, 0.03) 4px);
        }
        .ribbon {
            position: relative;
            background: linear-gradient(135deg, #8b7355 0%, #6b5744 100%);
            color: #faf7f2;
            padding: 8px 40px;
            font-size: 14px;
            font-style: italic;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .ribbon:before,
        .ribbon:after {
            content: '';
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-style: solid;
        }
        .ribbon:before {
            left: -20px;
            border-width: 20px 20px 20px 0;
            border-color: transparent #6b5744 transparent transparent;
        }
        .ribbon:after {
            right: -20px;
            border-width: 20px 0 20px 20px;
            border-color: transparent transparent transparent #6b5744;
        }
    </style>
</head>
<body>
    <div class="w-full h-full p-12 flex items-center justify-center">
        <div class="bg-[#fdfbf7] vintage-texture rounded-2xl shadow-2xl p-10 border-2 border-[#d4c4a8] w-full max-w-[700px]">
            <h1 class="text-[#3d2f1f] text-4xl font-bold mb-10 text-center border-b-2 border-[#d4c4a8] pb-4">Annual Growth Report</h1>
            
            <div class="grid grid-cols-2 gap-8 mb-10">
                <!-- Column 1 -->
                <div class="space-y-6">
                    <div class="text-center p-6 bg-[#f5f0e8] rounded-xl border-2 border-[#d4c4a8]">
                        <div class="w-16 h-16 bg-[#8b7355] rounded-full mx-auto mb-3 shadow-lg"></div>
                        <h2 class="text-[#3d2f1f] text-xl font-bold mb-3">Revenue Growth</h2>
                        <div class="text-[#8b7355] text-5xl font-bold mb-3">+42%</div>
                        <p class="text-[#5c4a3a] text-sm leading-relaxed">Strategic market expansion driving growth.</p>
                    </div>
                    
                    <div class="space-y-3">
                        <div class="flex items-center gap-3 bg-[#f5f0e8] p-3 rounded-lg border border-[#d4c4a8]">
                            <div class="w-12 h-12 bg-[#c9b896] rounded shadow"></div>
                            <div class="flex-1">
                                <div class="text-[#3d2f1f] font-bold">Q1</div>
                                <div class="text-[#8b7355] text-lg">$2.4M</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 bg-[#f5f0e8] p-3 rounded-lg border border-[#d4c4a8]">
                            <div class="w-12 h-12 bg-[#a89378] rounded shadow"></div>
                            <div class="flex-1">
                                <div class="text-[#3d2f1f] font-bold">Q2</div>
                                <div class="text-[#8b7355] text-lg">$3.1M</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 bg-[#f5f0e8] p-3 rounded-lg border border-[#d4c4a8]">
                            <div class="w-12 h-12 bg-[#8b7355] rounded shadow"></div>
                            <div class="flex-1">
                                <div class="text-[#3d2f1f] font-bold">Q3</div>
                                <div class="text-[#8b7355] text-lg">$3.8M</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Column 2 -->
                <div class="space-y-6">
                    <div class="text-center p-6 bg-[#f5f0e8] rounded-xl border-2 border-[#d4c4a8]">
                        <div class="w-16 h-16 bg-[#a89378] rounded-full mx-auto mb-3 shadow-lg"></div>
                        <h2 class="text-[#3d2f1f] text-xl font-bold mb-3">Satisfaction</h2>
                        <div class="text-[#8b7355] text-5xl font-bold mb-3">94%</div>
                        <p class="text-[#5c4a3a] text-sm leading-relaxed">Exceptional quality service excellence.</p>
                    </div>
                    
                    <div class="space-y-3">
                        <div class="flex items-center gap-3 bg-[#f5f0e8] p-3 rounded-lg border border-[#d4c4a8]">
                            <div class="w-12 h-12 bg-[#c9b896] rounded shadow"></div>
                            <div class="flex-1">
                                <div class="text-[#3d2f1f] font-bold">Response</div>
                                <div class="text-[#8b7355] text-lg">< 2h</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 bg-[#f5f0e8] p-3 rounded-lg border border-[#d4c4a8]">
                            <div class="w-12 h-12 bg-[#a89378] rounded shadow"></div>
                            <div class="flex-1">
                                <div class="text-[#3d2f1f] font-bold">Resolution</div>
                                <div class="text-[#8b7355] text-lg">98%</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 bg-[#f5f0e8] p-3 rounded-lg border border-[#d4c4a8]">
                            <div class="w-12 h-12 bg-[#8b7355] rounded shadow"></div>
                            <div class="flex-1">
                                <div class="text-[#3d2f1f] font-bold">Retention</div>
                                <div class="text-[#8b7355] text-lg">91%</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="text-center pt-4">
                <div class="ribbon">co-designed by kiquetal</div>
            </div>
        </div>
    </div>
</body>
</html>
