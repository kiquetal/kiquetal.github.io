<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    background: radial-gradient(circle at 50% 45%, #292524 0%, #1C1917 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
  }
  /* paper texture overlay */
  .og::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(0deg, rgba(245,240,235,0.03) 0px, rgba(245,240,235,0.03) 1px, transparent 1px, transparent 4px);
    pointer-events: none;
  }
  /* corner brackets */
  .corner { position: absolute; width: 44px; height: 44px; border: 3px solid #E7A66A; }
  .tl { top: 32px; left: 32px; border-right: none; border-bottom: none; }
  .tr { top: 32px; right: 32px; border-left: none; border-bottom: none; }
  .bl { bottom: 32px; left: 32px; border-right: none; border-top: none; }
  .br { bottom: 32px; right: 32px; border-left: none; border-top: none; }

  .brand {
    font-size: 20px; letter-spacing: 0.55em; font-weight: 500;
    color: #A8A29E; text-transform: uppercase; margin-bottom: 18px; padding-left: 0.55em;
  }
  .headline {
    font-family: 'Playfair Display', serif;
    font-style: italic; font-weight: 800; font-size: 68px; line-height: 1.05;
    color: #F5F0EB; text-align: center;
  }
  .headline .accent { color: #E7A66A; }
  .subtitle {
    margin-top: 22px; font-size: 16px; letter-spacing: 0.35em; font-weight: 500;
    color: #A8A29E; text-transform: uppercase; display: flex; align-items: center; gap: 12px;
  }
  .dot { color: #E7A66A; }
  .flag {
    display: inline-block; width: 22px; height: 15px; border-radius: 2px; overflow: hidden;
    background: linear-gradient(to bottom, #D52B1E 0 33%, #FFFFFF 33% 66%, #0038A8 66% 100%);
    vertical-align: middle; box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
  }
  .url {
    margin-top: 48px; font-size: 22px; letter-spacing: 0.35em; font-weight: 500;
    color: #E7A66A;
  }
</style>
</head>
<body>
  <div class="og">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="brand">KIQUETAL</div>
    <div class="headline">Resilience as a <span class="accent">First-Class</span> Citizen.</div>
    <div class="subtitle">
      System Engineer <span class="dot">●</span> Cloud Architect <span class="dot">●</span> <span class="flag"></span>
    </div>
    <div class="url">kiquetal.dev</div>
  </div>
</body>
</html>
