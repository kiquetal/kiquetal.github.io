<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDP vs TCP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #e5e7eb; }
        .infographic { width: 500px; height: 600px; background: linear-gradient(180deg, #ffffff 0%, #f9fafb 100%); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .kiquetal-ribbon { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); color: #f5f5f5; text-align: center; padding: 8px; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.15em; border-top: 1px solid #444; opacity: 0.85; }
        .kiquetal-ribbon::before { content: '✦'; margin-right: 8px; color: #888; }
        .kiquetal-ribbon::after { content: '✦'; margin-left: 8px; color: #888; }
    </style>
</head>
<body>
    <div class="infographic relative">
        <div class="p-8 h-full flex flex-col">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold mb-2">Protocol Comparison</h1>
                <p class="text-gray-500 text-sm">UDP vs TCP</p>
            </div>
            
            <div class="grid grid-cols-2 gap-6 flex-1">
                <div class="border-2 border-blue-200 rounded-xl p-4 bg-white">
                    <div class="text-center mb-4">
                        <div class="text-4xl mb-2">🚀</div>
                        <h2 class="text-2xl font-bold text-blue-600">UDP</h2>
                    </div>
                    <ul class="space-y-3 text-sm">
                        <li class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-blue-500 rounded-full"></span>
                            <span><strong>Fast</strong> transmission</span>
                        </li>
                        <li class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-blue-500 rounded-full"></span>
                            <span><strong>Connectionless</strong> protocol</span>
                        </li>
                        <li class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-blue-500 rounded-full"></span>
                            <span><strong>No guarantee</strong> delivery</span>
                        </li>
                        <li class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-blue-500 rounded-full"></span>
                            <span><strong>Streaming</strong> media</span>
                        </li>
                    </ul>
                </div>
                
                <div class="border-2 border-green-200 rounded-xl p-4 bg-white">
                    <div class="text-center mb-4">
                        <div class="text-4xl mb-2">🛡️</div>
                        <h2 class="text-2xl font-bold text-green-600">TCP</h2>
                    </div>
                    <ul class="space-y-3 text-sm">
                        <li class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                            <span><strong>Reliable</strong> delivery</span>
                        </li>
                        <li class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                            <span><strong>Connection-based</strong> setup</span>
                        </li>
                        <li class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                            <span><strong>Guaranteed</strong> packets</span>
                        </li>
                        <li class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                            <span><strong>Web browsing</strong> HTTP</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="kiquetal-ribbon">co-designed by kiquetal</div>
    </div>
</body>
</html>
