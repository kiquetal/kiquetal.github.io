<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Infographic - Sepia Minimal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8f4ed] min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <div class="mb-16">
            <h1 class="text-[#3d2f1f] text-6xl font-bold mb-4">2026</h1>
            <h2 class="text-[#8b7355] text-3xl font-light">Business Overview</h2>
        </div>
        
        <div class="grid md:grid-cols-2 gap-16 mb-24">
            <!-- Column 1 -->
            <div>
                <div class="mb-16">
                    <div class="w-24 h-1 bg-[#8b7355] mb-8"></div>
                    <h3 class="text-[#3d2f1f] text-3xl font-bold mb-8">Financial Performance</h3>
                    
                    <div class="space-y-12">
                        <div>
                            <div class="text-[#5c4a3a] text-sm uppercase tracking-wider mb-4">Total Revenue</div>
                            <div class="text-[#3d2f1f] text-6xl font-bold mb-2">$12.4M</div>
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-3 bg-[#8b7355] rounded-full"></div>
                                <span class="text-[#8b7355] text-lg">+38% YoY</span>
                            </div>
                        </div>
                        
                        <div>
                            <div class="text-[#5c4a3a] text-sm uppercase tracking-wider mb-4">Operating Margin</div>
                            <div class="text-[#3d2f1f] text-6xl font-bold mb-2">28%</div>
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-3 bg-[#a89378] rounded-full"></div>
                                <span class="text-[#8b7355] text-lg">+5.2 pts</span>
                            </div>
                        </div>
                        
                        <div>
                            <div class="text-[#5c4a3a] text-sm uppercase tracking-wider mb-4">Cash Flow</div>
                            <div class="text-[#3d2f1f] text-6xl font-bold mb-2">$4.1M</div>
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-3 bg-[#c9b896] rounded-full"></div>
                                <span class="text-[#8b7355] text-lg">Strong position</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Column 2 -->
            <div>
                <div class="mb-16">
                    <div class="w-24 h-1 bg-[#a89378] mb-8"></div>
                    <h3 class="text-[#3d2f1f] text-3xl font-bold mb-8">Operational Excellence</h3>
                    
                    <div class="space-y-12">
                        <div>
                            <div class="text-[#5c4a3a] text-sm uppercase tracking-wider mb-4">Active Projects</div>
                            <div class="text-[#3d2f1f] text-6xl font-bold mb-2">47</div>
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-3 bg-[#8b7355] rounded-full"></div>
                                <span class="text-[#8b7355] text-lg">12 completed</span>
                            </div>
                        </div>
                        
                        <div>
                            <div class="text-[#5c4a3a] text-sm uppercase tracking-wider mb-4">Client Base</div>
                            <div class="text-[#3d2f1f] text-6xl font-bold mb-2">234</div>
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-3 bg-[#a89378] rounded-full"></div>
                                <span class="text-[#8b7355] text-lg">18 countries</span>
                            </div>
                        </div>
                        
                        <div>
                            <div class="text-[#5c4a3a] text-sm uppercase tracking-wider mb-4">Team Members</div>
                            <div class="text-[#3d2f1f] text-6xl font-bold mb-2">156</div>
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-3 bg-[#c9b896] rounded-full"></div>
                                <span class="text-[#8b7355] text-lg">+42 this year</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="border-t border-[#d4c4a8] pt-8">
            <div class="text-center text-[#8b7355] text-sm italic">co-designed by kiquetal</div>
        </div>
    </div>
</body>
</html>
